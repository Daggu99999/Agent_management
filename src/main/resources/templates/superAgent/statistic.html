<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Policy Dashboard</title>
    <style>
        .dashboard-container { display: flex; gap: 20px; font-family: Arial, sans-serif; margin: 20px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 200px; text-align: center; box-shadow: 2px 2px 5px #eee; }
        .pending { border-left: 5px solid #ffc107; }
        .approved { border-left: 5px solid #28a745; }
        .rejected { border-left: 5px solid #dc3545; }
        h3 { margin: 0 0 10px 0; color: #555; }
        .count { font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>

<h2>Super Agent - Policy Statistic Dashboard</h2>

<div class="dashboard-container">
    <!-- Pending Policies Card -->
    <div class="card pending">
        <h3>PENDING</h3>
        <div class="count" th:text="${pendingPolicies}">0</div>
    </div>

    <!-- Approved Policies Card -->
    <div class="card approved">
        <h3>APPROVED</h3>
        <div class="count" th:text="${approvedPolicies}">0</div>
    </div>

    <!-- Rejected Policies Card -->
    <div class="card rejected">
        <h3>REJECTED</h3>
        <div class="count" th:text="${rejectedPolicies}">0</div>
    </div>
</div>

<br>
<a th:href="@{/api/superagent/dashboard}">Back to Dashboard</a>

</body>
</html>
