<!DOCTYPE html>
<!-- Fixed: Corrected Thymeleaf namespace URL structure -->
<html xmlns:th="http://w3.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Policy</title>
    <style>
        .form-container { max-width: 400px; margin: 50px auto; padding: 30px; background-color: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); font-family: sans-serif; }
        .form-container h2 { color: #0056b3; text-align: center; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #334155; }
        .form-container input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .submit-btn:hover { background-color: #004085; }
    </style>
</head>
<body style="background-color: #f4f7fc;">

<div class="form-container">
    <h2>Modify Policy Metrics</h2>
    <!--@thymesVar id="policy" type="AgentManagement.Entity.Policy"-->
    <form th:action="@{/api/superagent/policies/update/{id}(id=${policy.policyId})}" th:object="${policy}" method="POST">

        <!-- Fixed: Explicitly declared the tracking id parameter -->
        <input type="hidden" th:field="*{policyId}" id="policyId" />

        <div class="input-group">
            <label for="premiumAmount">Premium Amount (₹)</label>
            <!-- Fixed: Added explicit id matching the label 'for' reference attribute -->
            <input type="number" step="0.01" th:field="*{premiumAmount}" id="premiumAmount" required />
        </div>

        <div class="input-group">
            <label for="coverageAmount">Coverage Amount (₹)</label>
            <!-- Fixed: Added explicit id matching the label 'for' reference attribute -->
            <input type="number" step="0.01" th:field="*{coverageAmount}" id="coverageAmount" required />
        </div>

        <button type="submit" class="submit-btn">Update Fields</button>
    </form>
</div>

</body>
</html>
