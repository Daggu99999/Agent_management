<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Customer Dashboard</title>
    <style>
        .dashboard-container { display: flex; gap: 20px; font-family: Arial, sans-serif; margin: 20px; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 200px; text-align: center; box-shadow: 2px 2px 5px #eee; }
        .total { border-left: 5px solid #333; }
        .active { border-left: 5px solid #28a745; }
        .inactive { border-left: 5px solid #dc3545; }
        h3 { margin: 0 0 10px 0; color: #555; }
        .count { font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>

<h2>Super Agent - Customer Performance Dashboard</h2>

<div class="dashboard-container">
    <!-- Total Customers Card -->
    <div class="card total">
        <h3>Total Customers</h3>
        <div class="count" th:text="${totalCustomers}">0</div>
    </div>

    <!-- Active Customers Card -->
    <div class="card active">
        <h3>Active Customers</h3>
        <div class="count" th:text="${activeCustomers}">0</div>
    </div>

    <!-- Inactive Customers Card -->
    <div class="card inactive">
        <h3>Inactive Customers</h3>
        <div class="count" th:text="${inactiveCustomers}">0</div>
    </div>
</div>

<br>
<a th:href="@{/api/superagent/dashboard}">Back to Dashboard</a>

</body>
</html>
