<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Claims Dashboard</title>
    <style>
        .dashboard-container { display: flex; gap: 20px; font-family: Arial, sans-serif; margin: 20px; flex-wrap: wrap; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 180px; text-align: center; box-shadow: 2px 2px 5px #eee; }
        .submitted { border-left: 5px solid #17a2b8; }
        .assigned { border-left: 5px solid #007bff; }
        .review { border-left: 5px solid #ffc107; }
        .approved { border-left: 5px solid #28a745; }
        .rejected { border-left: 5px solid #dc3545; }
        .settled { border-left: 5px solid #6c757d; }
        h3 { margin: 0 0 10px 0; color: #555; font-size: 14px; text-transform: uppercase; }
        .count { font-size: 24px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<h2>Super Agent - Claims Status Dashboard</h2>

<div class="dashboard-container">
    <!-- Submitted -->
    <div class="card submitted">
        <h3>SUBMITTED</h3>
        <div class="count" th:text="${submittedClaims}">0</div>
    </div>

    <!-- Assigned -->
    <div class="card assigned">
        <h3>ASSIGNED</h3>
        <div class="count" th:text="${assignedClaims}">0</div>
    </div>

    <!-- Under Review -->
    <div class="card review">
        <h3>UNDER REVIEW</h3>
        <div class="count" th:text="${underReviewClaims}">0</div>
    </div>

    <!-- Approved -->
    <div class="card approved">
        <h3>APPROVED</h3>
        <div class="count" th:text="${approvedClaims}">0</div>
    </div>

    <!-- Rejected -->
    <div class="card rejected">
        <h3>REJECTED</h3>
        <div class="count" th:text="${rejectedClaims}">0</div>
    </div>

    <!-- Settled -->
    <div class="card settled">
        <h3>SETTLED</h3>
        <div class="count" th:text="${settledClaims}">0</div>
    </div>
</div>

<br>
<a th:href="@{/api/superagent/dashboard}">Back to Dashboard</a>

</body>
</html>
