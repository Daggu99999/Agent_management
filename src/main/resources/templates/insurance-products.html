<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animated Login Form with Changing Background | @coding.stella</title>
    <link rel="stylesheet" th:href="@{/insurence-products.css}">
</head>

<body>

<header class="header">
    <h1>Insurance Products</h1>


</header>

<div class="container">

    <div class="products-grid">

        <div class="product-card"
             th:each="product : ${products}">

            <h2 th:text="${product.productName}">
                Product Name
            </h2>

            <p>
                <strong>Policy Type:</strong>
                <span th:text="${product.policyType}"></span>
            </p>

            <p>
                <strong>Base Premium:</strong>
                ₹ <span th:text="${product.basePremium}"></span>
            </p>

            <p>
                <strong>Coverage Amount:</strong>
                ₹ <span th:text="${product.coverageAmount}"></span>
            </p>

            <p th:text="${product.description}">
                Description
            </p>

            <div class="benefits">

                <h4>Benefits</h4>

                <ul>
                    <li th:each="benefit : ${product.benefits}"
                        th:text="${benefit.benefitName}">
                    </li>
                </ul>

            </div>
            <form th:action="@{/customer/buy}" method="post">

                <input type="hidden"
                       name="productId"
                       th:value="${product.productId}">

                <button type="submit">
                    Buy Policy
                </button>

            </form>




        </div>

    </div>

</div>

</body>
</html>
